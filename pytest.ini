[pytest]
testpaths = tests
# The default run is the fast gate teammates and CI hit on every change: it must
# stay in seconds. Anything that pays a real data.load() or trains a model is
# marked slow and excluded here; run those explicitly with `pytest -m slow`.
# A command-line -m overrides this, since addopts are prepended.
addopts = -m "not slow"
markers =
    slow: pays a real data.load() or trains a model (tens of seconds to minutes)
